{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 animate-fade-up">
                <div class="card-body p-5">
                    <h2 class="text-center fw-bold mb-4 text-success">Join Harvest Hub</h2>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">I am a</label>
                            <select class="form-select" id="role" required>
                                <option value="customer">Consumer (Buyer)</option>
                                <option value="farmer">Farmer (Seller)</option>
                            </select>
                        </div>

                        <!-- Additional Farmer Fields -->
                        <div id="farmerFields" class="d-none">
                            <div class="mb-3">
                                <label class="form-label">Farm Location / Address</label>
                                <input type="text" class="form-control" id="address">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contact Number</label>
                                <input type="tel" class="form-control" id="contact">
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
                        </div>
                    </form>
                    <p class="text-center mt-3">Already have an account? <a href="{{ url_for('login') }}"
                            class="text-success fw-bold">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script type="module">
    import { auth, createUserWithEmailAndPassword, db, doc, setDoc } from "{{ url_for('static', filename='js/main.js') }}";

    const roleSelect = document.getElementById('role');
    const farmerFields = document.getElementById('farmerFields');

    roleSelect.addEventListener('change', () => {
        if (roleSelect.value === 'farmer') {
            farmerFields.classList.remove('d-none');
            document.getElementById('address').setAttribute('required', 'true');
            document.getElementById('contact').setAttribute('required', 'true');
        } else {
            farmerFields.classList.add('d-none');
            document.getElementById('address').removeAttribute('required');
            document.getElementById('contact').removeAttribute('required');
        }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const name = document.getElementById('name').value;
        const role = document.getElementById('role').value;

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // Save additional user data to Firestore VIA BACKEND API (Bypasses Client Rules)
            const response = await fetch('/api/register-user-data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    uid: user.uid,
                    email: email,
                    role: role,
                    name: name,
                    address: document.getElementById('address').value || '',
                    contact: document.getElementById('contact').value || ''
                })
            });

            const result = await response.json();
            if (result.status === 'success') {
                alert('Registration Successful! Redirecting to Login...');
                window.location.href = "{{ url_for('login') }}";
            } else {
                throw new Error(result.message);
            }

        } catch (error) {
            console.error(error);
            alert(error.message);
        }
    });
</script>
{% endblock %}
