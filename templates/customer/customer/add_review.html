{% extends "base.html" %}

{% block title %}Write Review{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Rate your Experience</h4>
                </div>
                <div class="card-body p-4">
                    <h5>Product: {{ order.product_name }}</h5>
                    <p class="text-muted small">Order #{{ order.id[:8] }}</p>

                    <form id="reviewForm">
                        <div class="mb-3">
                            <label class="form-label">Rating</label>
                            <div class="rating">
                                <select class="form-select" id="rating" required>
                                    <option value="5">★★★★★ (Excellent)</option>
                                    <option value="4">★★★★☆ (Good)</option>
                                    <option value="3">★★★☆☆ (Average)</option>
                                    <option value="2">★★☆☆☆ (Poor)</option>
                                    <option value="1">★☆☆☆☆ (Terrible)</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Review</label>
                            <textarea class="form-control" id="comment" rows="4" placeholder="Share your feedback..."
                                required></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Submit Review</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script type="module">
    import { db, auth } from "{{ url_for('static', filename='js/main.js') }}";
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    document.getElementById('reviewForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const user = auth.currentUser;
        if (!user) {
            alert('Please login.');
            return;
        }

        const rating = parseInt(document.getElementById('rating').value);
        const comment = document.getElementById('comment').value;

        try {
            const response = await fetch('/api/add-review', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    customer_name: user.displayName || 'Customer',
                    product_id: "{{ order.product_id }}",
                    product_name: "{{ order.product_name }}",
                    rating: rating,
                    comment: comment
                })
            });

            const result = await response.json();
            if (result.status === 'success') {
                alert('Review Submitted! Thank you.');
                window.location.href = "{{ url_for('my_orders') }}";
            } else {
                throw new Error(result.message);
            }

        } catch (error) {
            console.error("Review Error: ", error);
            alert(error.message);
        }
    });
</script>
{% endblock %}
