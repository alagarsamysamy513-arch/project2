{% extends "base.html" %}

{% block title %}Report Issue{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Report an Issue with your Order</h4>
                </div>
                <div class="card-body p-4">
                    <h5>Product: {{ order.product_name }}</h5>
                    <p class="text-muted small">Order #{{ order.id[:8] }}</p>

                    <form id="reportForm">
                        <div class="mb-3">
                            <label class="form-label">Reason for Report</label>
                            <select class="form-select" id="reason" required>
                                <option value="" disabled selected>Select a reason...</option>
                                <option value="Not Fresh">Product Not Fresh / Spoiled</option>
                                <option value="Damaged">Damaged Item</option>
                                <option value="Wrong Product">Wrong Product Delivered</option>
                                <option value="Quality Issue">Poor Quality</option>
                                <option value="Other">Other Issues</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description / Details</label>
                            <textarea class="form-control" id="description" rows="4" placeholder="Please describe the issue in detail..."
                                required></textarea>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger">Submit Report</button>
                            <a href="{{ url_for('my_orders') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script type="module">
    import { auth } from "{{ url_for('static', filename='js/main.js') }}";

    document.getElementById('reportForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const user = auth.currentUser;
        if (!user) {
            alert('Please login.');
            return;
        }

        const reason = document.getElementById('reason').value;
        const description = document.getElementById('description').value;
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Submitting...';

        try {
            const response = await fetch('/api/submit-report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    customer_name: user.displayName || user.email || 'Customer',
                    order_id: "{{ order.id }}",
                    product_name: "{{ order.product_name }}",
                    reason: reason,
                    description: description
                })
            });

            const result = await response.json();
            if (result.status === 'success') {
                alert('Report Submitted! Our team will contact you shortly.');
                window.location.href = "{{ url_for('my_orders') }}";
            } else {
                throw new Error(result.message);
            }

        } catch (error) {
            console.error("Report Error: ", error);
            alert(error.message);
            submitBtn.disabled = false;
            submitBtn.innerText = 'Submit Report';
        }
    });
</script>
{% endblock %}
