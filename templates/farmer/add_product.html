{% extends "base.html" %}

{% block title %}Add Product{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Add New Product</h4>
                </div>
                <div class="card-body p-4">
                    <form id="addProductForm">
                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <select class="form-select" id="category" required>
                                    <option value="">Select Category</option>
                                    <option value="Vegetables">Vegetables</option>
                                    <option value="Fruits">Fruits</option>
                                    <option value="Grains">Grains</option>
                                    <option value="Dairy">Dairy</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Price (₹ per kg/unit)</label>
                                <input type="number" class="form-control" id="price" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Available Quantity</label>
                            <input type="number" class="form-control" id="quantity" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Product Image URL (For now)</label>
                            <!-- In real app, we use File Input and upload to Firebase Storage -->
                            <input type="url" class="form-control" id="imageUrl"
                                placeholder="https://example.com/image.jpg" required>
                            <div class="form-text">Paste a direct image link.</div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success btn-lg">Add Product</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script type="module">
    import { db, doc, setDoc } from "{{ url_for('static', filename='js/main.js') }}";
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { auth } from "{{ url_for('static', filename='js/main.js') }}";

    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const user = auth.currentUser;
        if (!user) {
            alert('You must be logged in.');
            return;
        }

        const name = document.getElementById('name').value;
        const category = document.getElementById('category').value;
        const price = parseFloat(document.getElementById('price').value);
        const quantity = parseInt(document.getElementById('quantity').value);
        const imageUrl = document.getElementById('imageUrl').value;

        try {
            // Add product via Backend API
            const response = await fetch('/api/add-product', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: name,
                    category: category,
                    price: price,
                    quantity: quantity,
                    image_url: imageUrl,
                    farmer_name: user.displayName || 'Farmer'
                })
            });

            const result = await response.json();
            if (result.status === 'success') {
                alert('Product Added Successfully!');
                window.location.href = "{{ url_for('farmer_dashboard') }}";
            } else {
                throw new Error(result.message);
            }

        } catch (error) {
            console.error("Error adding product: ", error);
            alert("Error adding product: " + error.message);
        }
    });
</script>
{% endblock %}
